name: build-windows
on:
  push:
    branches: [ principal ]
  workflow_dispatch:

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias de Tauri
        run: |
          npm init -y
          npm install @tauri-apps/cli@next

      - name: Compilar ejecutable de Windows
        run: npx tauri build --bundles exe

      - name: Subir archivo EXE generado
        uses: actions/upload-artifact@v4
        with:
          name: GoChat-2.1-Windows-EXE
          path: src-tauri/target/release/bundle/exe/*.exe
