name: build-windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workload
        run: dotnet workload install maui --ignore-failed-sources

      - name: Restore
        run: dotnet restore GoChat.csproj

      - name: Publish Windows
        run: dotnet publish GoChat.csproj -f net10.0-windows10.0.19041.0 -c Release -o ./EXE

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GoChat-2.1-Windows-EXE
          path: ./EXE
